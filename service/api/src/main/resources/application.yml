server:
  port: 3001
spring:
  application:
    name: xin-ai-api
  # 行内注释1：全局 snake_case 命名策略 —— 接口文档与前端契约（apps/web/src/lib/contract.ts）
  # 统一使用下划线字段名（model_key / quote_fingerprint / asset_id ...），
  # 这里开启后，record 的 camelCase 属性会自动映射为 snake_case，
  # 显式标注 @JsonProperty 的字段（request_id / trace_id / page_size）不受影响。
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

  # 行内注释2：MySQL 数据源 —— 本地 MySQL 8.0。
  # 行内注释3：启动参数用环境变量覆盖，避免把密码写进仓库。
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:xin_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 30000
      pool-name: xin-ai-pool

  # 行内注释4：Flyway 管理 MySQL 表结构 —— V1 种子数据 + V2 业务表。
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # 行内注释5：Redis（本地）—— 用于验证码/会话/幂等键/目录缓存。
  # 行内注释6：Redis 不可用时不阻塞启动 —— 依赖 Redis 的功能自动降级到内存。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      repositories:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

xin:
  # 行内注释7：存储实现 —— mysql 用 MySqlDataStore，memory 用 MemStore。
  store:
    type: ${XIN_STORE_TYPE:mysql}
  # 行内注释8：中转站密钥加密口令 —— 生产务必用环境变量覆盖。
  channel:
    key-secret: ${XIN_CHANNEL_KEY_SECRET:xin-ai-dev-channel-secret}
  jwt:
    # 行内注释9：生产环境务必用环境变量 XIN_JWT_SECRET 覆盖。
    secret: ${XIN_JWT_SECRET:xin-ai-dev-secret-change-me}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 2592000
  sms:
    # 行内注释10：验证码下发方式 —— mock=本地生成并回传 dev_code（仅开发），real=调用短信服务商。
    # 行内注释11：mode=real 时响应里不再出现 dev_code，避免验证码泄露到前端/日志。
    mode: ${XIN_SMS_MODE:mock}
    # 行内注释12：real 模式下的服务商配置（阿里云短信示例，模板按实际改）。
    provider: ${XIN_SMS_PROVIDER:aliyun}
    access-key-id: ${XIN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${XIN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${XIN_SMS_SIGN_NAME:}
    template-code: ${XIN_SMS_TEMPLATE_CODE:}

logging:
  level:
    com.xin.ai: INFO
    org.flywaydb: INFO
